name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The @things/* packages resolve via their built dist/ (package main/types),
      # not from source — so nothing downstream (lint/typecheck/test/build) can
      # resolve them until they're compiled, exactly as the Docker images build
      # them first. A fresh checkout has no dist/ or .tsbuildinfo, so this emits
      # cleanly in topological order.
      - name: Build shared packages
        run: npm run build:packages

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  migration-drift:
    name: Prisma migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Integration tests use `prisma db push` (fast cold start), which never
    # consults the migration history — so a schema.prisma edit shipped WITHOUT
    # a matching migration would pass every test yet break `prisma migrate
    # deploy` in the prod entrypoint. This job replays each owned schema's
    # committed migrations into a throwaway shadow DB and diffs the result
    # against schema.prisma; any difference fails the build.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff committed migrations against schema.prisma (every owned schema)
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        run: |
          set -uo pipefail
          fail=0
          for app in api-auth api-do api-say api-buy api-eat api-send; do
            echo "::group::drift check — $app"
            if ( cd "apps/$app" && npx prisma migrate diff \
                  --from-migrations prisma/migrations \
                  --to-schema-datamodel prisma/schema.prisma \
                  --shadow-database-url "$SHADOW_DATABASE_URL" \
                  --exit-code ); then
              echo "✓ $app: schema.prisma matches its migrations"
            else
              echo "::error::$app: schema.prisma has drifted from prisma/migrations. Run 'npm run db:migrate -w apps/$app' to generate the missing migration, then commit it."
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
